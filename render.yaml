services:
  - type: web
    name: nexora-ai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NEXORA_HOST
        value: 0.0.0.0
      - key: NEXORA_PORT
        value: 10000
      - key: NEXORA_MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMINI_MODEL_NAME
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.7-flash
      - key: NEXORA_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
